<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ПОНГ · 8БИТ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Игровое поле -->
    <canvas id="game"></canvas>

    <!--
      Тач-управление (DOM-оверлей поверх canvas).
      Игроки стоят слева/справа и смотрят друг на друга.
      Ракетки ездят по вертикали (paddle up/down = screen Y).
      data-dir = направление движения РАКЕТКИ ("up" | "down").
      Подписи/ориентация кнопок настраиваются в controls.js + styles.css,
      чтобы для каждого игрока стрелки читались как "влево/вправо"
      относительно его тела (правый игрок повёрнут на 180°).
    -->
    <div class="controls" id="controls">
      <div class="controls-side controls-left" data-player="0">
        <button class="ctrl-btn" type="button" data-player="0" data-dir="up" aria-label="Игрок 1: влево">←</button>
        <button class="ctrl-btn" type="button" data-player="0" data-dir="down" aria-label="Игрок 1: вправо">→</button>
      </div>
      <div class="controls-side controls-right" data-player="1">
        <button class="ctrl-btn" type="button" data-player="1" data-dir="down" aria-label="Игрок 2: влево">←</button>
        <button class="ctrl-btn" type="button" data-player="1" data-dir="up" aria-label="Игрок 2: вправо">→</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
